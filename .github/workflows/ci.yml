name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v
      - name: The example study must pass its own checks
        run: uv run receipts check examples/agent-fleet
      - name: Generated files are up to date
        run: |
          uv run receipts build examples/agent-fleet
          git diff --exit-code -- examples/agent-fleet/receipts.json examples/agent-fleet/receipts.md
      - name: Figures script parses
        run: node --check figures/receipts-figures.js
