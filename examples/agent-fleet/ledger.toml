# ---------------------------------------------------------------- replay steps

[[step]]
title = "Boot a team from YAML"
sub = "a custom spec with two Claude Code seats"
evidence = ["002"]

[[step]]
title = "Hand the builder one bounded task"
sub = "the task description had a mistake in it: only one test was failing"
evidence = ["004"]
excerpt = "test_slug.py has 3 tests; two fail."

[[step]]
title = "The handoff goes through the queue"
sub = "the builder routed it without being told how"
evidence = ["005"]

[[step]]
title = "An independent review"
sub = "and it corrected the task description"
evidence = ["006"]
excerpt = """⏺ The slugify fix passes review with no blocking findings. I've sent the verdict
  back to the build seat on the queue.
  What I checked:
  - The diff is one line. It changes slug.py so the function strips dashes from
    both ends of the slug. Interior dashes are kept.
  - The tests are untouched. Git shows no change to test_slug.py.
  - All three tests pass. I ran them directly with python3 because pytest isn't
    installed here, which matches what the builder said.
  - The builder's correction holds. Only the trim test was failing before the
    fix, not two tests."""

[[step]]
title = "Tear the whole team down"
sub = "the processes are gone"
evidence = ["007"]

[[step]]
title = "Restore it, then ask what it remembers"
sub = "the conversation came back too"
evidence = ["008"]
