openrig = { status = "tested", note = "rig ask: grep over one rig's transcripts.", evidence = ["017"], excerpt = "Search: grep" }
herdr = { status = "not-found", note = "Not found.", looked = "herdr --help 0.9.5" }

[[capability]]
